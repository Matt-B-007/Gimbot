# SPDX-License-Identifier: MIT
# Publishes Gimbot automatically whenever files arrive on main.
#
# 1. If a Gimbot zip was uploaded to the top of the repository, unpack it over
#    the files (except .github/workflows, which this job isn't allowed to
#    change), delete the zip and commit.
# 2. If the version in CMakeLists.txt has no release yet: run every check
#    (scripts/check.sh), make the source tarball, SHA256SUMS and its minisign
#    signature, create a DRAFT release with them, verify, then publish.
#    Anything failing stops before publishing ("fails closed"); a draft left
#    behind by a failure is deleted, and the log says so.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # build provenance attestation
  attestations: write

concurrency: publish

jobs:
  publish:
    name: Publish a signed release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools, signing tool and pinned checkers
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules git dbus python-pip \
            qt6-base qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg qt6-svg \
            kcoreaddons kcrash kglobalaccel kstatusnotifieritem \
            minisign github-cli unzip zip
          pip install --break-system-packages shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust the checked-out folder (git in a container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Unpack an uploaded zip
        run: |
          shopt -s nullglob
          zips=( Gimbot*.zip gimbot*.zip )
          if (( ${#zips[@]} == 0 )); then echo "No zip uploaded."; exit 0; fi
          zip="$(printf '%s\n' "${zips[@]}" | sort -V | tail -n1)"
          echo "Unpacking $zip"
          tmp="$(mktemp -d)"
          unzip -q "$zip" -d "$tmp"
          # The zip normally holds one folder (Gimbot/); use what's inside it.
          src="$tmp"
          entries=( "$tmp"/* )
          if (( ${#entries[@]} == 1 )) && [[ -d "${entries[0]}" ]]; then src="${entries[0]}"; fi
          if [[ ! -f "$src/CMakeLists.txt" || ! -f "$src/install.sh" ]]; then
            echo "::error::$zip doesn't look like Gimbot (no CMakeLists.txt and install.sh inside)"
            exit 1
          fi
          git rm -q "${zips[@]}"
          # Replace every file with the zip's (files the zip no longer has
          # are removed), leaving .github/workflows alone.
          git ls-files -z | grep -zv '^\.github/workflows/' | xargs -0 -r git rm -q --
          tar -C "$src" --exclude=./.github/workflows -cf - . | tar -xf -
          chmod +x install.sh
          if [[ -d "$src/.github/workflows" ]] && ! diff -rq "$src/.github/workflows" .github/workflows >/dev/null; then
            echo "::warning::The zip has changed files in .github/workflows. GitHub doesn't let this job update them; upload them through the website."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -qm "Unpack $zip"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi

      - name: Is this version new?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^set\(GIMBOT_VERSION "([^"]+)".*/\1/p' CMakeLists.txt | head -n1)"
          if [[ -z "$version" ]]; then echo "::error::No GIMBOT_VERSION in CMakeLists.txt"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key is set up (MINISIGN_SECRET_KEY)
        if: steps.version.outputs.new == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "::error::MINISIGN_SECRET_KEY secret is missing, so this release can't be signed. Add it in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Run every check (bash scripts/check.sh)
        if: steps.version.outputs.new == 'true'
        run: bash scripts/check.sh

      - name: Make the source tarball, checksums and signature
        if: steps.version.outputs.new == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="Gimbot-$VERSION/" -o "dist/Gimbot-$VERSION-source.tar.gz" HEAD
          git archive --format=zip --prefix="Gimbot/" -o "dist/Gimbot-$VERSION-source.zip" HEAD
          (cd dist && sha256sum "Gimbot-$VERSION-source.tar.gz" "Gimbot-$VERSION-source.zip" > SHA256SUMS)
          # The key only ever exists in this file, readable by us alone, and
          # is removed straight after signing (also if signing fails).
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          # minisign wants its "untrusted comment:" first line; add it if the
          # secret was saved without it.
          (
            umask 077
            if [[ "$MINISIGN_SECRET_KEY" == "untrusted comment:"* ]]; then
              printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
            else
              printf 'untrusted comment: minisign secret key\n%s\n' "$MINISIGN_SECRET_KEY" > "$key"
            fi
          )
          chmod 600 "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -t "Gimbot v$VERSION" < /dev/null
          rm -f "$key"

      - name: Verify the signature with the embedded public keys (primary or backup)
        if: steps.version.outputs.new == 'true'
        run: |
          # The same check install.sh and Update now make: either key will do.
          primary=RWQcs3jtP2jTiAMafwQX8UwciSjOH4o9tQcCVvYl2NkdnOeVupKPlhvC
          backup=RWRObC9qlP598z1kmTFw7W+TKYKk3w2/63qWyRWkvRSkqGwGEgjmOlGe
          # Both keys must be the ones install.sh embeds.
          for k in "$primary" "$backup"; do
            if ! grep -qF "$k" install.sh; then echo "::error::install.sh doesn't embed public key $k"; exit 1; fi
          done
          ok=""
          for k in "$primary" "$backup"; do
            if minisign -Vm dist/SHA256SUMS -x dist/SHA256SUMS.minisig -P "$k" >/dev/null 2>&1; then ok="$k"; break; fi
          done
          if [[ -z "$ok" ]]; then
            echo "::error::SHA256SUMS.minisig doesn't verify with either embedded public key. If signing said 'Error while loading the secret key file', the secret's contents are wrong: paste the key file again."
            exit 1
          fi
          echo "Signature verified with public key ${ok:0:12}…"
          (cd dist && sha256sum -c SHA256SUMS)
          ls -l dist

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; split(substr($0, 4), w, " "); x = w[1]; sub(/^v/, "", x); found = (x == v); next }
            found' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1; fi
          {
            echo
            echo "**Install or update:**"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo "Downloads are checked with SHA256SUMS and its minisign signature before they're built."
          } >> notes.md

      - name: Build provenance attestation (public repositories only)
        if: steps.version.outputs.new == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create a draft release, upload, verify, publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          pre=()
          if [[ "$VERSION" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$tag" --draft --target "$(git rev-parse HEAD)" --title "Gimbot $VERSION" \
            --notes-file notes.md "${pre[@]}" dist/*
          echo "draft=$tag" >> "$GITHUB_ENV"
          # Every file must be on the draft before it goes public.
          for f in dist/*; do
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$(basename "$f")" \
              || { echo "::error::$(basename "$f") didn't upload"; exit 1; }
          done
          gh release edit "$tag" --draft=false
          echo "draft=" >> "$GITHUB_ENV"
          echo "Published $tag."

      - name: Remove the draft if publishing failed
        if: failure() && env.draft != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Publishing failed; deleting the draft release ${draft} so nothing half-finished is left."
          gh release delete "${draft}" --yes --cleanup-tag || echo "::warning::Couldn't delete the draft ${draft}; delete it on the Releases page."
